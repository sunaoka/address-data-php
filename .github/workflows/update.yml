name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '5 1 * * *'

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: |
            composer install --quiet --no-plugins --no-ansi --prefer-dist --no-progress --no-interaction

      - name: Update address data
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 60
          max_attempts: 3
          command: php builder/address-data-update.php

      - name: Count changes
        id: changes
        run: |
          git add -N .
          git diff --name-only --exit-code
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Update Address Data
          delete-branch: true
          title: Update Address Data
          body: |
            Address Data have been updated.
        if: steps.changes.outcome == 'failure'
